name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOCKERHUB_ADMIN_IMAGE: akrauter/coldnet-admin
  DOCKERHUB_WORKER_IMAGE: akrauter/coldnet-worker

jobs:
  build-and-test:
    name: Build & test
    # ubuntu-latest: the graphics/barcode modules are built on Magick.NET (cross-platform), so
    # running the full test suite here doubles as the actual proof that ColdNet runs on Linux -
    # not just an assumption from NuGet package metadata.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ColdNet.slnx

      - name: Build
        run: dotnet build ColdNet.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ColdNet.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  version:
    name: Determine release version
    needs: build-and-test
    # Only ever release from master, regardless of which event triggered the run.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Determine version
        id: version
        run: |
          echo "version=$(date +'%Y.%m.%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push Docker images
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ColdNet.Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ColdNet.Admin/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_ADMIN_IMAGE }}:latest
            ${{ env.DOCKERHUB_ADMIN_IMAGE }}:master-${{ needs.version.outputs.short_sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin

      - name: Build and push ColdNet.Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/ColdNet.Worker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_WORKER_IMAGE }}:latest
            ${{ env.DOCKERHUB_WORKER_IMAGE }}:master-${{ needs.version.outputs.short_sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  release-windows:
    name: Build & publish Windows release
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ColdNet.Admin (win-x64, self-contained)
        run: dotnet publish src/ColdNet.Admin/ColdNet.Admin.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/Admin

      - name: Publish ColdNet.Worker (win-x64, self-contained)
        run: dotnet publish src/ColdNet.Worker/ColdNet.Worker.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/Worker

      - name: Publish ColdNet.SecretTool (win-x64, self-contained)
        run: dotnet publish src/ColdNet.SecretTool/ColdNet.SecretTool.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/SecretTool

      - name: Assemble local-execution package
        shell: pwsh
        run: |
          Copy-Item deploy/local-release/Start-Admin.bat publish/
          Copy-Item deploy/local-release/Start-Worker.bat publish/
          Copy-Item deploy/local-release/README.txt publish/
          Compress-Archive -Path publish/Admin, publish/Worker, publish/SecretTool, publish/Start-Admin.bat, publish/Start-Worker.bat, publish/README.txt `
            -DestinationPath ColdNet-win-x64-${{ needs.version.outputs.version }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ColdNet ${{ needs.version.outputs.version }}
          target_commitish: master
          make_latest: true
          generate_release_notes: true
          files: ColdNet-win-x64-${{ needs.version.outputs.version }}.zip

  release-linux:
    name: Build & publish Linux release
    needs: [ version, release-windows ]
    # Runs on ubuntu-latest (not cross-compiled from the Windows job) so `dotnet publish` sets the
    # executable bit on the apphost binaries and start scripts itself - a tarball assembled on
    # Windows/NTFS has no real Unix permission bits to preserve, so its executables would land
    # non-executable after extraction on Linux.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish ColdNet.Admin (linux-x64, self-contained)
        run: dotnet publish src/ColdNet.Admin/ColdNet.Admin.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish/Admin

      - name: Publish ColdNet.Worker (linux-x64, self-contained)
        run: dotnet publish src/ColdNet.Worker/ColdNet.Worker.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish/Worker

      - name: Publish ColdNet.SecretTool (linux-x64, self-contained)
        run: dotnet publish src/ColdNet.SecretTool/ColdNet.SecretTool.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish/SecretTool

      - name: Assemble local-execution package
        run: |
          cp deploy/local-release/start-admin.sh publish/
          cp deploy/local-release/start-worker.sh publish/
          cp deploy/local-release/README-linux.txt publish/README.txt
          chmod +x publish/Admin/ColdNet.Admin publish/Worker/ColdNet.Worker publish/SecretTool/ColdNet.SecretTool
          chmod +x publish/start-admin.sh publish/start-worker.sh
          tar -czf ColdNet-linux-x64-${{ needs.version.outputs.version }}.tar.gz -C publish Admin Worker SecretTool start-admin.sh start-worker.sh README.txt

      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: master
          files: ColdNet-linux-x64-${{ needs.version.outputs.version }}.tar.gz
